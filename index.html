<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heart Music</title>

<style>
body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    cursor: pointer;
}

.wrapper {
    transform: scale(1);
    transition: transform 0.08s linear;
}

#heart {
    white-space: pre;
    color: #ff4d8d;
    font-family: monospace;
    font-size: 12px;
    line-height: 12px;
}
</style>
</head>

<body>

<div class="wrapper" id="wrapper">
    <div id="heart"></div>
</div>

<audio id="music" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script>

/* HEART */
const msg = "I love you nouryyy ";
let index = 0;
let output = "";

for (let y = 1.5; y > -1.5; y -= 0.05) {
    for (let x = -1.5; x < 1.5; x += 0.025) {

        let formula = Math.pow(x*x + y*y - 1, 3) - x*x*y*y*y;

        if (formula <= 0) {
            output += msg[index % msg.length];
            index++;
        } else {
            output += " ";
        }
    }
    output += "\n";
}

document.getElementById("heart").innerText = output;

/* MUSIC + HEARTBEAT */
const audio = document.getElementById("music");
const wrapper = document.getElementById("wrapper");

let started = false;

function beat() {
    let scale = 1 + Math.random() * 0.08;
    wrapper.style.transform = `scale(${scale})`;
}

function loop() {
    if (!started) return;
    beat();
    setTimeout(loop, 120);
}

/* GitHub-safe start */
function startEverything() {
    if (started) return;
    started = true;

    audio.play().catch(() => {});
    loop();
}

/* ANY interaction starts it */
document.body.addEventListener("click", startEverything);
document.body.addEventListener("touchstart", startEverything);
document.body.addEventListener("keydown", startEverything);

</script>

</body>
</html>
